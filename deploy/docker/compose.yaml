services:
  laso:
    build:
      context: ../..
    # Linux host networking preserves a loopback-only unauthenticated API.
    network_mode: host
    environment:
      LASO_POSTGRES_DSN: ${LASO_POSTGRES_DSN:?Set LASO_POSTGRES_DSN before deployment}
      LASO_DATA_DIR: /var/lib/laso
      LASO_API_HOST: 127.0.0.1
      LASO_API_PORT: "8080"
      LASO_JSON_LOGS: "true"
    volumes:
      - laso-state:/var/lib/laso
      - ../../config/laso.example.yaml:/etc/laso/laso.yaml:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  laso-state:
